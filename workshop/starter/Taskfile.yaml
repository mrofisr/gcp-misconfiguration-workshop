version: '3'

# Cross-platform entry point (go-task). Same four commands as Makefile and Setup.ps1.
tasks:
  doctor:
    desc: Read-only prerequisite check; changes no Google Cloud resource
    cmds:
      - bash ../scripts/doctor.sh

  plan:
    desc: Preview the vulnerable infrastructure; changes no Google Cloud resource
    cmds:
      - bash ../scripts/plan.sh

  apply:
    desc: Create the deliberately vulnerable bucket, permissions, key, and Cloud Run service
    cmds:
      - bash ../scripts/apply.sh

  destroy:
    desc: Remove every lab resource; safe to run twice
    cmds:
      - bash ../scripts/destroy.sh

  help:
    desc: List available tasks
    cmds:
      - task --list
